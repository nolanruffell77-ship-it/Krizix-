<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root { 
            --bg: #090b0d; 
            --card: rgba(17, 20, 23, 0.7); 
            --card2: rgba(22, 26, 30, 0.9); 
            --text: #8a9099; 
            --white: #ffffff; 
            --green: #2ecc71; 
            --accent-color: #2ecc71;
            --neon-glow: rgba(46, 204, 113, 0.5);
            --border: rgba(255, 255, 255, 0.08); 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }

        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 0 6%; height: 75px; background: rgba(9, 11, 13, 0.6); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
        .logo-wrap { display: flex; align-items: center; text-decoration: none; color: var(--white) !important; }
        .logo-wrap img { height: 50px; margin-right: 10px; }
        .logo-wrap span { font-family: 'Bebas Neue'; font-size: 26px; color: var(--white); letter-spacing: 1px; }

        .nav-links { display: flex; list-style: none; gap: 28px; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text); font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: .5px; transition: color 0.25s; position: relative; }
        .nav-links a::after { content: ''; position: absolute; left: 0; bottom: -4px; width: 0; height: 2px; background: var(--green); transition: width 0.3s; }
        .nav-links a:hover { color: var(--white) !important; }
        .nav-links a:hover::after { width: 100%; }

        .dropdown { position: relative; padding: 10px 0; }
        .dropdown-content { display: none; position: absolute; top: 100%; left: 0; background: var(--card2); min-width: 200px; border-radius: 12px; padding: 10px 0; border: 1px solid var(--border); backdrop-filter: blur(15px); }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a { display: flex !important; align-items: center; gap: 10px; padding: 10px 20px; font-size: 13px; text-transform: none; color: var(--text) !important; }
        .dropdown-content a::after { display: none; }
        .dropdown-content a:hover { color: var(--green) !important; background: rgba(255,255,255,0.02); }
        .game-nav-icon { width: 18px; height: 18px; object-fit: contain; border-radius: 3px; }

        .lang-switch, .theme-switch { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--white); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 700; transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px; }
        .lang-switch:hover, .theme-switch:hover { border-color: var(--green); color: var(--green); box-shadow: 0 0 10px var(--neon-glow); }

        .btn-discord { background: transparent; color: var(--white) !important; border: 1.5px solid rgba(255,255,255,0.15); padding: 9px 22px; border-radius: 50px; text-transform: uppercase; font-weight: 700; font-size: 12px; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
        .btn-discord:hover { background: var(--green) !important; color: #000000 !important; border-color: var(--green) !important; box-shadow: 0 0 15px var(--neon-glow); }

        main { max-width: 900px; margin: 120px auto 80px auto; padding: 0 20px; }
        .page-header-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { font-family: 'Bebas Neue'; font-size: 3rem; color: #fff; border-left: 4px solid var(--green); padding-left: 15px; }

        .suggestions-list { display: flex; flex-direction: column; gap: 15px; }
        .suggestion-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; display: flex; justify-content: space-between; align-items: center; gap: 20px; backdrop-filter: blur(15px); transition: border-color 0.2s; }
        .suggestion-card:hover { border-color: rgba(255, 255, 255, 0.15); }
        
        .suggestion-meta { font-size: 12px; color: var(--green); font-weight: 700; margin-bottom: 6px; display: flex; gap: 10px; }
        .suggestion-date { color: #7f8691; font-weight: 400; }
        .suggestion-content { color: #fff; font-size: 14px; line-height: 1.6; }

        .actions-group { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .btn-check-toggle { 
            width: 42px; height: 42px; border-radius: 10px; 
            border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); 
            color: #8a9099; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; font-size: 16px; 
        }
        .btn-check-toggle.is-viewed { 
            background: var(--green) !important; border-color: var(--green) !important; color: #000000 !important; 
        }

        footer { text-align: center; font-size: 13px; margin-top: 60px; padding-bottom: 30px; color: #505660; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <nav>
        <a href="index.html" class="logo-wrap">
            <img src="https://r2.fivemanage.com/yn4c41n5WF0bvUIcGBLe9/krizix_logo_copie-removebg-preview.png" alt="Logo">
            <span>Krizix Esport</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html" data-fr="Accueil" data-en="Home">Accueil</a></li>
            <li><a href="club.html" data-fr="Le Club" data-en="The Club">Le Club</a></li>
            <li class="dropdown">
                <a href="#" data-fr="Rosters" data-en="Rosters">Rosters <i class="fa-solid fa-chevron-down" style="font-size:10px;"></i></a>
                <div class="dropdown-content">
                    <a href="roster-fortnite.html"><img src="https://r2.fivemanage.com/ertC6YGygtOAcgjrGF7nb/Fortnite_F_lettermark_logo(1).png" class="game-nav-icon" alt="Fortnite"> Fortnite</a>
                    <a href="roster-rl.html"><img src="https://r2.fivemanage.com/ertC6YGygtOAcgjrGF7nb/avt5ka5bd-removebg-preview.png" class="game-nav-icon" alt="Rocket League"> Rocket League</a>
                    <a href="roster-valorant.html"><img src="https://r2.fivemanage.com/ertC6YGygtOAcgjrGF7nb/tlcharg(10).jpg" class="game-nav-icon" alt="Valorant"> Valorant</a>
                    <a href="roster-minecraft.html"><img src="https://r2.fivemanage.com/ertC6YGygtOAcgjrGF7nb/png-clipartminecraft-youtube-logo-png-green-minecraft-icon-branding5511673-thumbnail-removebg-preview.png" class="game-nav-icon" alt="Minecraft"> Minecraft</a>
                    <a href="roster-r6.html"><img src="https://r2.fivemanage.com/ertC6YGygtOAcgjrGF7nb/product-E1063325_3-removebg-preview.png" class="game-nav-icon" alt="Rainbow Six Siege"> Rainbow Six Siege</a>
                    <a href="roster-apex.html"><img src="https://r2.fivemanage.com/ertC6YGygtOAcgjrGF7nb/Apex-Legends-Logo-PNG-Download-Image-removebg-preview.png" class="game-nav-icon" alt="Apex Legends"> Apex Legends</a>
                </div>
            </li>
            <li><a href="boutique.html" data-fr="Boutique" data-en="Shop">Boutique</a></li>
            <li><button class="theme-switch" onclick="toggleTheme()" title="Changer de couleur (Vert / Bleu)"><i class="fa-solid fa-palette"></i> <span id="theme-name-label">Vert</span></button></li>
            <li><button class="lang-switch" onclick="toggleLanguage()">FR / EN</button></li>
            <li id="auth-nav-item">
                <button type="button" class="btn-discord" onclick="loginWithDiscord()">
                    <i class="fa-brands fa-discord"></i> Connexion
                </button>
            </li>
        </ul>
    </nav>

    <main>
        <div class="page-header-title">
            <h1 data-fr="BOÎTE À SUGGESTIONS (STAFF)" data-en="SUGGESTIONS BOX (STAFF)">BOÎTE À SUGGESTIONS (STAFF)</h1>
        </div>
        <div id="admin-suggestions-container" class="suggestions-list"></div>
    </main>

    <footer>&copy; 2026 Krizix Esport. Espace Staff.</footer>

    <script>
        // --- GESTION DU THÈME GLOBAL DU SITE (VERT / BLEU ET NÉONS) ---
        function toggleTheme() {
            const currentTheme = localStorage.getItem('krizix_theme') || 'green';
            const newTheme = currentTheme === 'green' ? 'blue' : 'green';
            applyTheme(newTheme);
        }

        function applyTheme(themeName) {
            localStorage.setItem('krizix_theme', themeName);
            
            const root = document.documentElement;
            let mainColor, neonShadow;

            if (themeName === 'blue') {
                mainColor = '#3498db';
                neonShadow = 'rgba(52, 152, 219, 0.6)';
                if(document.getElementById('theme-name-label')) document.getElementById('theme-name-label').innerText = 'Bleu';
            } else {
                mainColor = '#2ecc71';
                neonShadow = 'rgba(46, 204, 113, 0.6)';
                if(document.getElementById('theme-name-label')) document.getElementById('theme-name-label').innerText = 'Vert';
            }

            root.style.setProperty('--green', mainColor);
            root.style.setProperty('--accent-color', mainColor);
            root.style.setProperty('--neon-glow', neonShadow);
        }

        // Charger le thème global au démarrage
        const savedTheme = localStorage.getItem('krizix_theme') || 'green';
        applyTheme(savedTheme);

        // --- VÉRIFICATION STRICTE DES DROITS ADMIN (ID DISCORD) ---
        function checkIsAdminUser() {
            const savedUser = localStorage.getItem('krizix_user');
            const ADMIN_IDS = ["1078676804010770512", "1222520269550260246", "883405254761267243"];
            if (savedUser) {
                try {
                    const user = JSON.parse(savedUser);
                    if (user && user.id && ADMIN_IDS.includes(String(user.id))) {
                        return true;
                    }
                } catch(e) {}
            }
            return false;
        }

        function sendAdminLog(actionTitle, beforeData, afterData, simpleDetails = null) {
            const savedUser = JSON.parse(localStorage.getItem('krizix_user') || '{}');
            const author = savedUser.username || savedUser.global_name || savedUser.name || "Administrateur Staff";

            fetch('http://fi4.bot-hosting.cloud:25145/api/send-log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: author,
                    action: actionTitle,
                    before: beforeData,
                    after: afterData,
                    details: simpleDetails
                })
            }).catch(err => console.error("Erreur d'envoi du log :", err));
        }

        function renderAdminSuggestions() {
            if (!checkIsAdminUser()) {
                window.location.href = "index.html";
                return;
            }

            const savedUser = localStorage.getItem('krizix_user');
            const user = JSON.parse(savedUser);
            const staffId = String(user.id);

            const container = document.getElementById('admin-suggestions-container');
            const suggestions = JSON.parse(localStorage.getItem('krizix_suggestions') || '[]');
            const viewedBy = JSON.parse(localStorage.getItem('krizix_viewed_suggestions') || '{}');
            const staffViewedList = viewedBy[staffId] || [];

            if (suggestions.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#7f8691; padding:50px; background:var(--card); border-radius:16px;">Aucune suggestion soumise pour le moment.</div>`;
                return;
            }

            container.innerHTML = suggestions.map(s => {
                const isViewed = staffViewedList.includes(s.id);
                return `
                    <div class="suggestion-card">
                        <div>
                            <div class="suggestion-meta">
                                <span>@${s.author}</span>
                                <span class="suggestion-date">${s.date}</span>
                            </div>
                            <div class="suggestion-content">${s.text}</div>
                        </div>
                        <div class="actions-group">
                            <button type="button" 
                                    class="btn-check-toggle ${isViewed ? 'is-viewed' : ''}" 
                                    onclick="toggleViewedStatus('${s.id}', '${staffId}', '${s.author}', this)"
                                    title="${isViewed ? 'Marquée comme vue' : 'Marquer comme vue'}">
                                <i class="fa-solid fa-check"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleViewedStatus(suggestionId, staffId, authorName, buttonEl) {
            if (!checkIsAdminUser()) return;
            let viewedBy = JSON.parse(localStorage.getItem('krizix_viewed_suggestions') || '{}');
            if (!viewedBy[staffId]) viewedBy[staffId] = [];

            const index = viewedBy[staffId].indexOf(suggestionId);
            
            // Récupérer le nom de l'admin connecté pour le mettre en titre de l'action
            const savedUser = JSON.parse(localStorage.getItem('krizix_user') || '{}');
            const adminName = savedUser.username || savedUser.global_name || savedUser.name || "Administrateur";

            if (index === -1) {
                viewedBy[staffId].push(suggestionId);
                buttonEl.classList.add('is-viewed');

                const beforeTxt = `• **Statut :** Non lue`;
                const afterTxt = `• **Statut :** Marquée comme lue (Auteur de la suggestion : @${authorName})`;
                sendAdminLog(adminName, beforeTxt, afterTxt);
            } else {
                viewedBy[staffId].splice(index, 1);
                buttonEl.classList.remove('is-viewed');

                const beforeTxt = `• **Statut :** Marquée comme lue`;
                const afterTxt = `• **Statut :** Non lue (Auteur de la suggestion : @${authorName})`;
                sendAdminLog(adminName, beforeTxt, afterTxt);
            }

            localStorage.setItem('krizix_viewed_suggestions', JSON.stringify(viewedBy));
        }

        document.addEventListener('DOMContentLoaded', renderAdminSuggestions);

        let currentLang = localStorage.getItem('krizix_lang') || 'fr';
        function applyLanguage() { 
            document.querySelectorAll('[data-fr]').forEach(el => {
                const text = el.getAttribute('data-' + currentLang);
                if (text) el.innerText = text;
            }); 
        }
        function toggleLanguage() { 
            currentLang = currentLang === 'fr' ? 'en' : 'fr'; 
            localStorage.setItem('krizix_lang', currentLang); 
            applyLanguage(); 
        } 
        applyLanguage();

        const scene = new THREE.Scene(); 
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000); 
        const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('bg-canvas'), alpha: true, antialias: true}); 
        renderer.setSize(window.innerWidth, window.innerHeight);

        const pGeo = new THREE.BufferGeometry(); 
        const pPos = new Float32Array(7500); 
        for(let i=0;i<7500;i++) pPos[i] = (Math.random()-0.5)*50; 
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3)); 
        const pMat = new THREE.PointsMaterial({color: 0x2ecc71, size: 0.08, transparent: true, opacity: 0.25}); 
        const pSys = new THREE.Points(pGeo, pMat); 
        scene.add(pSys); 
        camera.position.z = 18;

        function anim() { 
            requestAnimationFrame(anim); 
            pSys.rotation.y += 0.0008; 
            renderer.render(scene, camera); 
        } 
        anim();
    </script>
    <script src="auth.js"></script>
</body>
</html>
